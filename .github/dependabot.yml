version: 2
# LOGIC CHANGE 2026-11-09: updates are GROUPED. Each ecosystem's minor and patch releases
# arrive as one PR a week instead of one PR per package, so staying current is one merge;
# a major release still comes alone, because it is the kind that needs reading. Merging
# deploys itself: auto-update.js runs the full suite on the merged commit (lib/update-gate.js)
# before it restarts into it.
updates:
  # LOGIC CHANGE 2026-11-01: the owner's rule is that every piece of software is kept at
  # its newest version. The googleapis ignore (added 2026-10-05 because 178.1+ needed
  # Node 22 and the image was Node 20) is removed with the move to Node 26, and the
  # Dockerfile's pinned base image is now watched too, so a new Node release arrives as
  # a PR instead of waiting for someone to notice.
  # tests/dependency-upgrade.test.js still fails on any production package whose
  # engines.node excludes the Node the image ships, so a future bump past the image is
  # caught before merge.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    commit-message:
      prefix: "deps"
    groups:
      npm-minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 2
    labels:
      - "dependencies"
    commit-message:
      prefix: "deps"
    groups:
      docker-minor-and-patch:
        update-types:
          - "minor"
          - "patch"
