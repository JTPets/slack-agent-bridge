# docker-compose.example.yml — the deployment definition, kept in the repository.
#
# WHY THIS FILE EXISTS. The live `docker-compose.yml` sits inside the NAS deploy
# directory, which IS the git checkout the bridge runs (docs/CONFIG-SURFACE-AND-REBUILD.md
# -> Step 0, consequence 1). It is untracked, so the only copy of the file that defines
# the deployment lived on the box it defines. This file is the off-box copy, and it is
# the rebuild artifact Step 5 item 3 asked for: a file, not prose in an appendix.
#
# The live `docker-compose.yml` is now also gitignored, so `git clean -fd` in the deploy
# directory can no longer delete it (WORK-TODO #26).
#
# WHAT IS AND IS NOT VERIFIED. The uncommented block below reproduces the live compose
# file as the owner rewrote it on 2026-10-10 (work mount, exec + init, no SqTools mount;
# validated with `docker compose config` and recreated the same day). The 2026-09-14
# capture recorded in docs/CONFIG-SURFACE-AND-REBUILD.md -> Appendix is the older shape. That capture is OWNER-SUPPLIED: it is
# not regenerable from a checkout. Re-read the live file before trusting this one:
#
#   cat /share/CACHEDEV1_DATA/jt-agent/docker-compose.yml
#
# The host paths below are the real NAS paths, not placeholders. They are host paths,
# not secrets, and they are already in this repository's appendix; a rebuild wants a
# file it can copy and run, not one it has to fill in. Substitute them if the share
# layout changes. NO SECRET BELONGS IN THIS FILE — credentials live only in the
# env_file, which is off-repo and must never be committed.
#
# WHAT TOOLCHAINS THIS IMAGE PROVIDES, AND WHY THE LIST IS WRITTEN DOWN.
# `lib/dependency-install.js` installs a dispatched repo's OWN dependencies into its
# scratch clone using whatever this image carries. That makes the image's toolchain a
# deployment fact, so it is stated here rather than discovered by a dispatch failing:
#
#   node    package.json (+ package-lock.json -> `npm ci`)  -> SUPPORTED. node and npm
#           ARE the image (the Dockerfile's node base).
#   python  requirements.txt / pyproject.toml / setup.py    -> NOT SUPPORTED yet. Since
#           2026-11-09 the image carries python3-venv (owner paste: `python3 -m venv`
#           exit 0), so a per-clone venv can be created; python stays NOT SUPPORTED until
#           a python repo is dispatched to end to end and its pins are named. WORK-TODO #68.
#   other   no recognised manifest                          -> nothing is installed and
#           the task proceeds (research/audit tasks).
#
# A SYSTEM PACKAGE goes in the tracked Dockerfile (root, at build), never in `command:`,
# which runs at every start as `user: "1000:100"`. Rebuild with the command in the
# Dockerfile header, then `docker compose up -d --force-recreate bridge`.
#
# A toolchain baked in here is also a PIN that can drift from what the target repo runs
# on. dayz-discord-bot's working setup is pytest-asyncio 0.21.2, pinned in prose only;
# a different resolution in this image yields a green here that is not a green on the
# box. Anything added to the SUPPORTED list owes that statement.
#
# TO REBUILD:
#   cp docker-compose.example.yml /share/CACHEDEV1_DATA/jt-agent/docker-compose.yml
#   # restore .env and .deploy_key from the off-box store (Step 5 items 4 and 5)
#   DOCKER_CONFIG=/tmp/jt-docker-config docker build --pull --no-cache -t jt-agent:local /share/CACHEDEV1_DATA/jt-agent
#   docker compose up -d

services:
  bridge:
    # LOGIC CHANGE 2026-11-09: the tracked Dockerfile's image (WORK-TODO #70), applied on the
    # box the same day. Build it first; there is deliberately no `build:` key, because on QNAP
    # `docker compose build` cannot create its config folder (see the Dockerfile header):
    #   DOCKER_CONFIG=/tmp/jt-docker-config docker build --pull --no-cache -t jt-agent:local /share/CACHEDEV1_DATA/jt-agent
    # Was `image: node:26` with the CLI installed at every start (2026-11-01 to 2026-11-09).
    image: jt-agent:local
    container_name: jt-agent
    user: "1000:100"
    working_dir: /bridge
    env_file:
      - /share/CACHEDEV1_DATA/jt-agent/.env
    environment:
      TZ: America/New_York
      HOME: /bridge/.claude-home
      # No NPM_CONFIG_PREFIX or PATH override since 2026-11-09: the CLI is the image's
      # /usr/local/bin/claude, and .env's CLAUDE_BIN must name that path (not
      # /bridge/.npm-global/bin/claude, a stale copy left in the bind mount).
    volumes:
      - /share/CACHEDEV1_DATA/jt-agent:/bridge
      # WORK_DIR on a mount, so a --force-recreate keeps the task lock, the queue and every
      # preserved scratch clone (WORK-TODO #25, closed 2026-10-10). There is deliberately NO
      # SqTools mount: the read-only /repo mount was removed on the box 2026-10-10 (WORK-TODO
      # #75). Nothing in this repository read it. Never add a SqTools path here.
      - /share/CACHEDEV1_DATA/jt-agent/work:/tmp/bridge-agent
    # This line is the ONLY install step in the deployment, and it runs unprivileged
    # at every container start. See "WHAT TOOLCHAINS THIS IMAGE PROVIDES" at the top.
    # `exec` makes node replace sh, and `init: true` puts docker-init in front as PID 1 to
    # forward SIGTERM and reap a task's child processes, so a restart reaches
    # bridge-agent.js's gracefulShutdown(). 90s covers the handler's 60s wait. WORK-TODO #73,
    # applied and verified on the box 2026-10-10 (PID 1 /sbin/docker-init, node pid 7).
    # A task still running after the 60s wait is still lost; the handler then exits.
    # Since 2026-11-09 the start installs only the repo's own dependencies; the CLI is in
    # the image.
    command: sh -c "npm ci && exec node bridge-agent.js"
    init: true
    stop_grace_period: 90s
    restart: unless-stopped

    # ---------------------------------------------------------------------------
    # PROPOSED HARDENING — commented out deliberately. NONE OF IT HAS BEEN TESTED
    # AGAINST THE LIVE BRIDGE. Each block is explained, with its verification and its
    # failure mode, in docs/CONFIG-SURFACE-AND-REBUILD.md -> Step 7.7. Apply one at a
    # time, with `docker compose logs -f bridge` open, and confirm a real TASK: runs
    # end to end before applying the next. Revert = re-comment the block and
    # `docker compose up -d --force-recreate bridge`.
    # ---------------------------------------------------------------------------

    # Bound the container's log growth. The NAS also hosts the SqTools postgres volume;
    # an unbounded json-file log on a shared disk is a production outage with a boring
    # cause. Verify: docker inspect -f '{{.HostConfig.LogConfig}}' jt-agent
    # logging:
    #   driver: json-file
    #   options:
    #     max-size: "20m"
    #     max-file: "5"

    # Fence the bridge away from the production database's working set — the same
    # reasoning as the ollama systemd fence in CLAUDE.md. A task runs `npm ci` and a
    # jest suite inside a scratch clone; that is the burst this bounds.
    # Tune to the box: these must leave postgres + the SqTools app their working set.
    # Verify: docker inspect -f '{{.HostConfig.Memory}} {{.HostConfig.NanoCpus}}' jt-agent
    # Failure mode if set too low: the container is OOM-killed mid-task and restarts,
    # which looks exactly like a crash. Watch `docker events` after applying.
    # mem_limit: 3g
    # cpus: 2.0
    # pids_limit: 512

    # A task executes through a shell with --dangerously-skip-permissions. Neither node,
    # git, nor the Claude CLI needs a capability or a setuid escalation.
    # Verify: docker inspect -f '{{.HostConfig.SecurityOpt}} {{.HostConfig.CapDrop}}' jt-agent
    # Failure mode: an npm postinstall that shells out to something setuid would break.
    # security_opt:
    #   - no-new-privileges:true
    # cap_drop:
    #   - ALL

    # ---------------------------------------------------------------------------
    # B6 (2026-10-04) — every item of this section is now applied on the box.
    # ---------------------------------------------------------------------------

    # (1), (3) and (4) of this section were APPLIED on the box 2026-10-10 and are now in
    # the live block above: exec + init + stop_grace_period (#73), the WORK_DIR mount (#25),
    # and the SqTools /repo mount removed (#75).

    # (2) BUILD THE IMAGE — APPLIED 2026-11-09 and now in the live block above (#70, closed).
    # Verify: docker exec jt-agent sh -c 'command -v claude; claude --version'
